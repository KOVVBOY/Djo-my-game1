<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Крылья (сзади) -->
  <ellipse cx="85" cy="30" rx="30" ry="12" fill="#E3F2FD" opacity="0.4" stroke="#90CAF9" stroke-width="1.5" transform="rotate(-15 85 30)"/>
  <ellipse cx="90" cy="45" rx="25" ry="10" fill="#E3F2FD" opacity="0.4" stroke="#90CAF9" stroke-width="1.5" transform="rotate(-5 90 45)"/>

  <!-- Жало (тактический клинок за спиной) -->
  <path d="M 85 65 L 115 80 L 80 75 Z" fill="#37474F" stroke="#212121" stroke-width="2"/>

  <!-- Задняя нога -->
  <path d="M 70 85 L 65 110 L 55 115 L 75 115 L 80 105 L 75 85" fill="#558B2F" stroke="#33691E" stroke-width="2"/>
  <rect x="50" y="110" width="30" height="12" fill="#212121" rx="3"/> <!-- Ботинок -->

  <!-- Задняя рука -->
  <path d="M 55 55 L 45 70 L 55 85 L 65 80 L 65 65 Z" fill="#F57F17" stroke="#E65100" stroke-width="2"/>

  <!-- Торс (мощная грудь, V-образная форма) -->
  <path d="M 50 40 Q 75 25 100 40 L 95 75 Q 75 85 55 75 Z" fill="#FFC107" stroke="#F57F17" stroke-width="2"/>
  <!-- Полосы на груди (камуфляж) -->
  <path d="M 60 35 L 60 80" stroke="#212121" stroke-width="6" opacity="0.8"/>
  <path d="M 80 30 L 80 85" stroke="#212121" stroke-width="6" opacity="0.8"/>
  <path d="M 100 40 L 95 75" stroke="#212121" stroke-width="4" opacity="0.8"/>

  <!-- Тактический бронежилет -->
  <path d="M 55 50 L 90 45 L 85 70 L 60 75 Z" fill="#263238" stroke="#455A64" stroke-width="2"/>
  <!-- Подсумки и ремни -->
  <rect x="60" y="55" width="10" height="12" fill="#37474F" rx="2"/>
  <rect x="75" y="52" width="10" height="12" fill="#37474F" rx="2"/>
  <path d="M 55 60 L 90 55" stroke="#212121" stroke-width="3"/>
  <path d="M 58 70 L 85 65" stroke="#212121" stroke-width="3"/>

  <!-- Передняя нога (камуфляжные штаны) -->
  <path d="M 60 85 L 55 115 L 45 115 L 65 115 L 70 110 L 75 85" fill="#558B2F" stroke="#33691E" stroke-width="2"/>
  <rect x="40" y="115" width="30" height="12" fill="#212121" rx="3"/> <!-- Ботинок -->
  <rect x="40" y="120" width="30" height="4" fill="#455A64"/> <!-- Подошва -->

  <!-- Передняя рука (держит дробовик) -->
  <path d="M 95 55 L 115 60 L 115 70 L 90 70 Z" fill="#F57F17" stroke="#E65100" stroke-width="2"/>
  <!-- Плечо -->
  <circle cx="95" cy="55" r="8" fill="#F57F17" stroke="#E65100" stroke-width="2"/>

  <!-- Дробовик -->
  <rect x="105" y="55" width="25" height="8" fill="#37474F" rx="2"/> <!-- Ствол -->
  <rect x="100" y="65" width="10" height="15" fill="#212121" rx="2"/> <!-- Рукоять -->
  <rect x="115" y="65" width="15" height="6" fill="#212121"/> <!-- Приклад -->

  <!-- Голова -->
  <circle cx="65" cy="30" r="22" fill="#FFC107" stroke="#F57F17" stroke-width="2"/>

  <!-- Тактическая бандана -->
  <path d="M 43 25 Q 65 15 87 25 L 87 32 Q 65 22 43 32 Z" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
  <path d="M 85 28 L 100 25 L 95 35 Z" fill="#D32F2F"/> <!-- Хвост банданы -->

  <!-- Тёмные очки (суровый взгляд) -->
  <rect x="45" y="28" width="40" height="10" rx="3" fill="#1A1A1A" stroke="#000000" stroke-width="1.5"/>
  <rect x="48" y="30" width="15" height="6" fill="#607D8B" rx="1"/> <!-- Блик -->
  <rect x="67" y="30" width="15" height="6" fill="#607D8B" rx="1"/> <!-- Блик -->

  <!-- Сигара -->
  <rect x="80" y="42" width="18" height="4" fill="#3E2723" rx="1"/>
  <circle cx="98" cy="44" r="2" fill="#FF5722"/> <!-- Тлеющий кончик -->

  <!-- Усики (антенны) -->
  <path d="M 50 15 Q 40 5 35 10" stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="35" cy="10" r="3" fill="#212121"/>
  <path d="M 75 12 Q 85 5 90 10" stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="10" r="3" fill="#212121"/>

  <!-- Шрам на лице (для брутальности) -->
  <line x1="85" y1="20" x2="80" y2="35" stroke="#D32F2F" stroke-width="2" opacity="0.8"/>
</svg>
