<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- ФОН (прозрачный) -->

  <!-- КРЫЛЬЯ (за спиной, простые) -->
  <rect x="42" y="22" width="14" height="16" fill="#AED6F1" opacity="0.6"/>
  <rect x="45" y="25" width="8" height="10" fill="#FFFFFF" opacity="0.8"/>

  <!-- ЗАДНЯЯ НОГА (палочка) -->
  <rect x="34" y="46" width="4" height="10" fill="#FFCA28"/>

  <!-- ЗАДНИЙ БОТИНОК (Огромный) -->
  <rect x="28" y="54" width="16" height="8" fill="#1A1A1A"/>
  <rect x="28" y="60" width="16" height="3" fill="#3E2723"/> <!-- Подошва -->
  <rect x="30" y="55" width="3" height="2" fill="#616161"/> <!-- Блик -->
  <rect x="37" y="55" width="3" height="2" fill="#616161"/> <!-- Блик -->

  <!-- ТЕЛО (Гуманоидный торс) -->
  <rect x="20" y="28" width="24" height="18" fill="#FFCA28"/>
  
  <!-- БРОНЕЖИЛЕТ / КУРТКА (Чёрная, как у Рэмбо) -->
  <rect x="20" y="28" width="24" height="12" fill="#1A1A1A"/>
  <!-- Ремень -->
  <rect x="20" y="40" width="24" height="4" fill="#3E2723"/>
  <rect x="28" y="40" width="8" height="4" fill="#616161"/> <!-- Пряжка -->

  <!-- ПЕРЕДНЯЯ НОГА (палочка) -->
  <rect x="26" y="46" width="4" height="10" fill="#FFCA28"/>

  <!-- ПЕРЕДНИЙ БОТИНОК (Огромный, с бликами) -->
  <rect x="14" y="54" width="18" height="8" fill="#1A1A1A"/>
  <rect x="14" y="60" width="18" height="3" fill="#3E2723"/> <!-- Подошва -->
  <rect x="16" y="55" width="4" height="2" fill="#616161"/> <!-- Блик -->
  <rect x="24" y="55" width="4" height="2" fill="#616161"/> <!-- Блик -->

  <!-- СИЛЬНЫЕ РУКИ (Мускулистые, без оружия) -->
  <!-- Левая рука -->
  <rect x="12" y="28" width="8" height="14" fill="#FFCA28"/>
  <rect x="12" y="40" width="8" height="6" fill="#1A1A1A"/> <!-- Чёрный кулак -->
  
  <!-- Правая рука -->
  <rect x="44" y="28" width="8" height="14" fill="#FFCA28"/>
  <rect x="44" y="40" width="8" height="6" fill="#1A1A1A"/> <!-- Чёрный кулак -->

  <!-- ГОЛОВА (Крупная) -->
  <rect x="18" y="6" width="28" height="22" rx="4" fill="#FFCA28"/>

  <!-- БАНДАНА (Красная, как у Рэмбо) -->
  <rect x="16" y="2" width="32" height="6" fill="#D32F2F"/>
  <rect x="46" y="4" width="8" height="4" fill="#D32F2F"/> <!-- Хвост банданы -->
  <rect x="52" y="6" width="6" height="3" fill="#D32F2F"/> <!-- Кончик хвоста -->

  <!-- ТЁМНЫЕ ОЧКИ-АВИАТОРЫ (Как у Рэмбо/Терминатора) -->
  <rect x="18" y="12" width="28" height="6" fill="#1A1A1A"/>
  <!-- Блики на очках -->
  <rect x="22" y="13" width="6" height="2" fill="#FFFFFF"/>
  <rect x="36" y="13" width="6" height="2" fill="#FFFFFF"/>

  <!-- СУРОВЫЙ РОТ -->
  <rect x="26" y="22" width="12" height="2" fill="#1A1A1A"/>

  <!-- УСИКИ (Короткие, торчат вверх) -->
  <rect x="22" y="0" width="2" height="6" fill="#1A1A1A"/>
  <rect x="40" y="0" width="2" height="6" fill="#1A1A1A"/>
</svg>
