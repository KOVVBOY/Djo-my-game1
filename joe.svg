<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Фон (прозрачный) -->

  <!-- КРЫЛЬЯ (сзади, как на твоём рисунке) -->
  <rect x="22" y="8" width="10" height="16" fill="#AED6F1" opacity="0.7"/>
  <rect x="24" y="12" width="8" height="10" fill="#AED6F1" opacity="0.7"/>

  <!-- ЗАДНЯЯ НОГА -->
  <rect x="18" y="24" width="4" height="6" fill="#F1C40F"/>
  <rect x="16" y="30" width="8" height="2" fill="#3E2723"/> <!-- Ботинок -->

  <!-- ТЕЛО (Мощный торс) -->
  <rect x="8" y="14" width="12" height="12" fill="#F1C40F"/>
  
  <!-- БРОНЕЖИЛЕТ (Тёмно-серый) -->
  <rect x="8" y="14" width="12" height="8" fill="#424242"/>
  <rect x="8" y="22" width="12" height="2" fill="#212121"/> <!-- Ремень -->
  <rect x="13" y="22" width="2" height="2" fill="#F1C40F"/> <!-- Пряжка -->

  <!-- ГОЛОВА И ШЛЕМ -->
  <rect x="8" y="4" width="12" height="10" fill="#F1C40F"/>
  
  <!-- ШЛЕМ / БАНДАНА (Красный, как на рисунке) -->
  <rect x="6" y="2" width="16" height="4" fill="#D32F2F"/>
  <rect x="20" y="4" width="4" height="2" fill="#D32F2F"/> <!-- Хвостик банданы -->

  <!-- ЗАБРАЛО / ОЧКИ (Тёмное, как у Терминатора) -->
  <rect x="8" y="7" width="12" height="4" fill="#1A1A1A"/>
  <rect x="10" y="7" width="2" height="1" fill="#FFFFFF"/> <!-- Блик -->
  <rect x="16" y="7" width="2" height="1" fill="#FFFFFF"/> <!-- Блик -->

  <!-- РУКА С ПУШКОЙ (Слева, как на рисунке) -->
  <rect x="4" y="16" width="4" height="4" fill="#F1C40F"/>
  
  <!-- ПУШКА (Большая, серая) -->
  <rect x="0" y="16" width="8" height="4" fill="#616161"/> <!-- Ствол -->
  <rect x="0" y="17" width="2" height="2" fill="#1A1A1A"/> <!-- Дуло -->
  <rect x="2" y="20" width="3" height="4" fill="#424242"/> <!-- Магазин -->

  <!-- ПЕРЕДНЯЯ НОГА -->
  <rect x="10" y="24" width="4" height="6" fill="#F1C40F"/>
  <rect x="8" y="30" width="8" height="2" fill="#3E2723"/> <!-- Ботинок -->

  <!-- ДЕТАЛИ: РОТ И УСИКИ -->
  <rect x="10" y="11" width="6" height="1" fill="#1A1A1A"/> <!-- Суровый рот -->
  <rect x="6" y="2" width="2" height="2" fill="#1A1A1A"/> <!-- Усик -->
  <rect x="24" y="2" width="2" height="2" fill="#1A1A1A"/> <!-- Усик -->
</svg>
