<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- ФОН (прозрачный) -->

  <!-- КРЫЛЬЯ (Сзади, с характерными зубцами, как на рисунке) -->
  <path d="M 130 100 L 210 70 L 195 110 L 235 120 L 160 170 L 140 140 Z" fill="#37474F" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Блики на крыльях -->
  <path d="M 170 90 L 190 85 L 185 105" fill="none" stroke="#607D8B" stroke-width="3" stroke-linecap="round"/>

  <!-- ЗАДНЯЯ НОГА -->
  <path d="M 140 180 L 135 230 L 150 230 L 145 180 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Задний ботинок (Огромный, чёрный) -->
  <path d="M 135 220 L 100 235 L 95 245 L 160 245 L 155 220 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>

  <!-- ТЕЛО (Форма груши, слегка наклонено) -->
  <path d="M 105 90 C 70 100 70 160 90 190 C 110 200 140 200 150 180 C 160 140 150 90 105 90 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- РЕМЕНЬ ЧЕРЕЗ ТЕЛО (Толстый, диагональный) -->
  <path d="M 75 180 L 155 90 L 145 80 L 65 170 Z" fill="#3E2723" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Пряжка ремня -->
  <circle cx="110" cy="135" r="10" fill="#616161" stroke="#1A1A1A" stroke-width="5"/>
  <circle cx="110" cy="135" r="4" fill="#1A1A1A"/>
  <line x1="110" y1="125" x2="110" y2="145" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ПЕРЕДНЯЯ НОГА -->
  <path d="M 110 185 L 85 230 L 100 230 L 120 185 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Передний ботинок (Огромный, чёрный) -->
  <path d="M 85 220 L 55 235 L 50 245 L 115 245 L 110 220 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>

  <!-- РУКИ (Короткие, мускулистые) -->
  <!-- Левая рука (под пушкой) -->
  <path d="M 85 125 C 60 140 65 170 85 170" fill="none" stroke="#F1C40F" stroke-width="20" stroke-linecap="round"/>
  <path d="M 85 125 C 60 140 65 170 85 170" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- Правая рука (держит рукоять) -->
  <path d="M 145 125 C 165 140 160 160 145 165" fill="none" stroke="#F1C40F" stroke-width="18" stroke-linecap="round"/>
  <path d="M 145 125 C 165 140 160 160 145 165" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>

  <!-- ОГРОМНАЯ ПУШКА (Диагональная, с раструбом) -->
  <!-- Основной ствол -->
  <path d="M 60 200 L 180 80 L 195 95 L 75 215 Z" fill="#424242" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  <!-- Раструб (Расширение на конце) -->
  <path d="M 175 85 L 225 35 L 245 55 L 195 105 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  <!-- Рукоять/Приклад (внизу) -->
  <path d="M 60 200 L 40 220 L 55 235 L 75 215 Z" fill="#3E2723" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Спусковой крючок / деталь магазина -->
  <path d="M 110 145 L 125 160 L 115 170 L 100 155 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="5"/>
  <!-- Полоски на стволе для текстуры -->
  <line x1="90" y1="170" x2="100" y2="180" stroke="#1A1A1A" stroke-width="4"/>
  <line x1="110" y1="150" x2="120" y2="160" stroke="#1A1A1A" stroke-width="4"/>
  <line x1="130" y1="130" x2="140" y2="140" stroke="#1A1A1A" stroke-width="4"/>

  <!-- ГОЛОВА (Наклонённая, грушевидная) -->
  <path d="M 115 20 C 90 20 80 50 85 80 C 90 100 130 105 150 90 C 170 70 160 20 115 20 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>

  <!-- УСИКИ (Забавно закрученные) -->
  <path d="M 105 25 C 90 -5 70 10 75 25" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="75" cy="25" r="5" fill="#1A1A1A"/>
  <path d="M 135 25 C 150 -5 170 10 165 25" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="165" cy="25" r="5" fill="#1A1A1A"/>

  <!-- ЗЛЫЕ ГЛАЗА (Как на твоём рисунке) -->
  <!-- Брови (Сведены к центру) -->
  <path d="M 95 50 L 115 60" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 145 50 L 125 60" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- Глаза (маленькие зрачки) -->
  <ellipse cx="110" cy="67" rx="5" ry="7" fill="#1A1A1A"/>
  <ellipse cx="130" cy="67" rx="5" ry="7" fill="#1A1A1A"/>

  <!-- НОС / МОРДА (Выступает вперёд) -->
  <path d="M 120 70 C 110 85 115 95 125 95" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>

  <!-- СУРОВЫЙ РОТ (Дуга вниз) -->
  <path d="M 105 85 Q 120 75 135 85" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
</svg>
