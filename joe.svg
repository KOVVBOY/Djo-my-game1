<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- ФОН (прозрачный) -->

  <!-- КРЫЛЬЯ (сзади, как на твоём скетче) -->
  <rect x="42" y="14" width="20" height="24" fill="#AED6F1" opacity="0.5"/>
  <rect x="46" y="18" width="16" height="16" fill="#AED6F1" opacity="0.7"/>
  <rect x="48" y="22" width="12" height="10" fill="#FFFFFF" opacity="0.8"/>

  <!-- ЗАДНЯЯ НОГА И БОТИНОК -->
  <rect x="38" y="50" width="6" height="12" fill="#F1C40F"/>
  <rect x="34" y="58" width="14" height="6" fill="#3E2723"/> <!-- Ботинок -->
  <rect x="34" y="62" width="14" height="2" fill="#1A1A1A"/> <!-- Подошва -->

  <!-- БРЮШКО ШМЕЛЯ (Сзади, округлое, БЕЗ ЖАЛА) -->
  <rect x="42" y="36" width="18" height="20" rx="6" fill="#FFCA28"/>
  <!-- Чёрные полоски на брюшке -->
  <rect x="48" y="36" width="4" height="20" fill="#212121"/>
  <rect x="56" y="36" width="4" height="20" fill="#212121"/>

  <!-- ТОРС (Мощный, в куртке) -->
  <rect x="18" y="26" width="24" height="28" fill="#1A1A1A"/>
  <!-- Жёлтая полоса (видно тело шмеля под курткой) -->
  <rect x="28" y="26" width="8" height="28" fill="#F1C40F"/>
  
  <!-- ВОРОТНИК КУРТКИ -->
  <rect x="18" y="26" width="24" height="4" fill="#424242"/>

  <!-- ПЕРЕДНЯЯ НОГА И БОТИНОК -->
  <rect x="22" y="50" width="6" height="12" fill="#F1C40F"/>
  <rect x="18" y="58" width="14" height="6" fill="#3E2723"/> <!-- Ботинок -->
  <rect x="18" y="62" width="14" height="2" fill="#1A1A1A"/> <!-- Подошва -->

  <!-- РУКА (Держит пушку) -->
  <rect x="14" y="32" width="6" height="14" fill="#1A1A1A"/>
  <rect x="12" y="44" width="8" height="6" fill="#F1C40F"/> <!-- Кулак -->

  <!-- ПУШКА (Спереди, как на скетче) -->
  <rect x="0" y="32" width="16" height="8" fill="#616161"/> <!-- Ствол -->
  <rect x="0" y="34" width="4" height="4" fill="#1A1A1A"/> <!-- Дуло -->
  <rect x="4" y="40" width="8" height="12" fill="#424242"/> <!-- Магазин -->
  <rect x="8" y="44" width="4" height="4" fill="#1A1A1A"/> <!-- Рукоять -->

  <!-- ГОЛОВА (Крупная, как ты и просил) -->
  <rect x="16" y="4" width="32" height="24" rx="10" fill="#F1C40F"/>
  
  <!-- ТЕНЬ ПОД ПОДБОРОДКОМ -->
  <rect x="16" y="22" width="32" height="6" fill="#F9A825"/>

  <!-- БАНДАНА (Красная, развевается сзади) -->
  <rect x="12" y="0" width="36" height="8" fill="#D32F2F"/>
  <rect x="44" y="4" width="12" height="4" fill="#D32F2F"/>
  <rect x="52" y="8" width="10" height="4" fill="#D32F2F"/>

  <!-- ОЧКИ АВИАТОРЫ (Огромные, как на рисунке) -->
  <rect x="16" y="10" width="32" height="8" fill="#1A1A1A"/>
  <rect x="20" y="12" width="6" height="4" fill="#FFFFFF"/> <!-- Блик -->
  <rect x="36" y="12" width="6" height="4" fill="#FFFFFF"/> <!-- Блик -->

  <!-- СУРОВЫЙ РОТ -->
  <rect x="24" y="20" width="12" height="2" fill="#1A1A1A"/>

  <!-- УСИКИ (Торчат вверх) -->
  <rect x="22" y="-2" width="2" height="6" fill="#1A1A1A"/>
  <rect x="20" y="-4" width="6" height="2" fill="#1A1A1A"/>
  <rect x="40" y="-2" width="2" height="6" fill="#1A1A1A"/>
  <rect x="38" y="-4" width="6" height="2" fill="#1A1A1A"/>
</svg>
