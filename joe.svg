<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- КРЫЛЬЯ -->
  <ellipse cx="85" cy="45" rx="28" ry="12" fill="#E3F2FD" opacity="0.6" stroke="#90CAF9" stroke-width="2" transform="rotate(-15 85 45)"/>
  <ellipse cx="80" cy="60" rx="25" ry="10" fill="#E3F2FD" opacity="0.6" stroke="#90CAF9" stroke-width="2" transform="rotate(-5 80 60)"/>

  <!-- БРЮШКО (БЕЗ ЖАЛА) -->
  <ellipse cx="80" cy="85" rx="22" ry="18" fill="#FFC107" stroke="#212121" stroke-width="2"/>
  <!-- Полоски на брюшке -->
  <path d="M 65 75 Q 63 85 65 95" stroke="#212121" stroke-width="6" fill="none"/>
  <path d="M 80 70 Q 78 85 80 100" stroke="#212121" stroke-width="6" fill="none"/>
  <path d="M 95 75 Q 93 85 95 95" stroke="#212121" stroke-width="6" fill="none"/>

  <!-- НОГИ И БОТИНКИ -->
  <!-- Левая нога -->
  <path d="M 55 90 L 50 115 L 45 115" stroke="#212121" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <rect x="38" y="110" width="18" height="12" rx="3" fill="#1B5E20" stroke="#212121" stroke-width="2"/>
  <rect x="38" y="116" width="18" height="6" fill="#212121"/> <!-- Подошва -->
  
  <!-- Правая нога -->
  <path d="M 75 90 L 80 115 L 85 115" stroke="#212121" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <rect x="72" y="110" width="18" height="12" rx="3" fill="#1B5E20" stroke="#212121" stroke-width="2"/>
  <rect x="72" y="116" width="18" height="6" fill="#212121"/> <!-- Подошва -->

  <!-- КОЖАНАЯ КУРТКА (ТОРС) -->
  <path d="M 45 60 L 75 60 L 85 95 L 45 95 Z" fill="#3E2723" stroke="#212121" stroke-width="2"/>
  <!-- Воротник -->
  <path d="M 45 60 L 60 75 L 75 60" fill="#4E342E" stroke="#212121" stroke-width="2"/>
  <!-- Молния -->
  <line x1="65" y1="60" x2="65" y2="95" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Ремень -->
  <rect x="45" y="88" width="40" height="8" fill="#212121"/>
  <rect x="62" y="86" width="6" height="12" rx="2" fill="#FFC107"/> <!-- Пряжка -->

  <!-- РУКИ -->
  <!-- Левая рука (с пистолетом) -->
  <path d="M 45 65 L 30 80" stroke="#3E2723" stroke-width="10" stroke-linecap="round"/>
  <circle cx="28" cy="82" r="6" fill="#FFC107" stroke="#212121" stroke-width="1.5"/> <!-- Кулак -->
  <!-- Пистолет в руке -->
  <rect x="15" y="78" width="15" height="6" fill="#37474F" stroke="#212121" stroke-width="1"/>
  <rect x="20" y="84" width="6" height="8" fill="#263238"/>
  
  <!-- Правая рука -->
  <path d="M 75 65 L 90 80" stroke="#3E2723" stroke-width="10" stroke-linecap="round"/>
  <circle cx="92" cy="82" r="6" fill="#FFC107" stroke="#212121" stroke-width="1.5"/> <!-- Кулак -->

  <!-- ГОЛОВА (КРУПНАЯ) -->
  <circle cx="60" cy="35" r="28" fill="#FFC107" stroke="#212121" stroke-width="2"/>

  <!-- БАНДАНА -->
  <path d="M 32 25 Q 60 10 88 25 L 88 32 Q 60 18 32 32 Z" fill="#D32F2F" stroke="#212121" stroke-width="2"/>
  <path d="M 85 28 L 100 20 L 95 35 Z" fill="#D32F2F" stroke="#212121" stroke-width="2"/> <!-- Хвостик банданы -->

  <!-- ОЧКИ АВИАТОРЫ -->
  <path d="M 38 32 L 58 32 L 55 45 L 42 45 Z" fill="#212121" stroke="#9E9E9E" stroke-width="2"/>
  <path d="M 62 32 L 82 32 L 78 45 L 65 45 Z" fill="#212121" stroke="#9E9E9E" stroke-width="2"/>
  <line x1="58" y1="36" x2="62" y2="36" stroke="#9E9E9E" stroke-width="2"/> <!-- Перемычка очков -->

  <!-- СУРОВЫЙ РОТ / ЩЕТИНА -->
  <path d="M 50 52 Q 60 56 70 52" stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 48 48 L 52 52 M 72 48 L 68 52" stroke="#212121" stroke-width="2" stroke-linecap="round"/> <!-- Морщины -->

  <!-- УСИКИ -->
  <line x1="45" y1="10" x2="35" y2="2" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <circle cx="33" cy="1" r="4" fill="#212121"/>
  <line x1="75" y1="10" x2="85" y2="2" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <circle cx="87" cy="1" r="4" fill="#212121"/>
</svg>
