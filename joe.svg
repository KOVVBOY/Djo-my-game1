<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- ФОН (прозрачный) -->

  <!-- КРЫЛЬЯ (Сзади, полупрозрачные) -->
  <rect x="85" y="25" width="35" height="45" fill="#AED6F1" opacity="0.5"/>
  <rect x="95" y="30" width="25" height="35" fill="#AED6F1" opacity="0.8"/>
  <rect x="105" y="35" width="15" height="20" fill="#FFFFFF" opacity="0.9"/>

  <!-- ЗАДНЯЯ НОГА И БОТИНОК -->
  <rect x="75" y="105" width="12" height="20" fill="#F1C40F"/>
  <rect x="65" y="120" width="28" height="8" fill="#3E2723"/> <!-- Ботинок -->
  <rect x="65" y="126" width="28" height="2" fill="#1A1A1A"/> <!-- Подошва -->
  <rect x="70" y="122" width="20" height="2" fill="#1A1A1A"/> <!-- Шнуровка -->

  <!-- БРЮШКО ШМЕЛЯ (Сзади, округлое, БЕЗ ЖАЛА) -->
  <rect x="80" y="70" width="40" height="40" rx="12" fill="#FFCA28"/>
  <!-- Чёрные полоски на брюшке -->
  <rect x="90" y="70" width="8" height="40" fill="#212121"/>
  <rect x="105" y="70" width="8" height="40" fill="#212121"/>
  <!-- Тень на брюшке -->
  <rect x="80" y="100" width="40" height="10" rx="5" fill="#F9A825"/>

  <!-- ТОРС (Кожаная куртка) -->
  <rect x="35" y="55" width="50" height="55" fill="#1A1A1A"/>
  <!-- Воротник -->
  <rect x="35" y="55" width="50" height="8" fill="#424242"/>
  <!-- Жёлтая полоса (тело шмеля под курткой) -->
  <rect x="55" y="63" width="10" height="47" fill="#F1C40F"/>
  
  <!-- БРОНЕЖИЛЕТ -->
  <rect x="40" y="70" width="40" height="25" fill="#616161"/>
  <rect x="40" y="75" width="40" height="4" fill="#1A1A1A"/>
  <rect x="40" y="85" width="40" height="4" fill="#1A1A1A"/>
  
  <!-- ПАТРОННАЯ ЛЕНТА ЧЕРЕЗ ПЛЕЧО -->
  <rect x="45" y="60" width="8" height="40" fill="#FFCA28" transform="rotate(15 45 60)"/>
  <rect x="48" y="65" width="4" height="4" fill="#1A1A1A"/>
  <rect x="52" y="75" width="4" height="4" fill="#1A1A1A"/>
  <rect x="56" y="85" width="4" height="4" fill="#1A1A1A"/>

  <!-- ПЕРЕДНЯЯ НОГА И БОТИНОК -->
  <rect x="45" y="105" width="12" height="20" fill="#F1C40F"/>
  <rect x="35" y="120" width="28" height="8" fill="#3E2723"/> <!-- Ботинок -->
  <rect x="35" y="126" width="28" height="2" fill="#1A1A1A"/> <!-- Подошва -->
  <rect x="40" y="122" width="20" height="2" fill="#1A1A1A"/> <!-- Шнуровка -->

  <!-- РУКА (Держит пушку) -->
  <rect x="25" y="70" width="15" height="20" fill="#1A1A1A"/>
  <rect x="20" y="88" width="20" height="10" fill="#F1C40F"/> <!-- Кулак -->

  <!-- ПУШКА (Спереди) -->
  <rect x="10" y="65" width="30" height="15" fill="#616161"/> <!-- Ствол -->
  <rect x="0" y="68" width="15" height="9" fill="#1A1A1A"/> <!-- Дуло -->
  <rect x="15" y="80" width="18" height="22" fill="#424242"/> <!-- Магазин -->
  <rect x="20" y="85" width="8" height="8" fill="#1A1A1A"/> <!-- Рукоять -->

  <!-- ГОЛОВА (Крупная) -->
  <rect x="30" y="10" width="60" height="50" rx="15" fill="#F1C40F"/>
  
  <!-- ТЕНЬ ПОД ПОДБОРОДКОМ -->
  <rect x="30" y="50" width="60" height="10" fill="#F9A825"/>

  <!-- БАНДАНА (Красная, развевается сзади) -->
  <rect x="20" y="0" width="80" height="16" fill="#D32F2F"/>
  <rect x="95" y="10" width="25" height="8" fill="#D32F2F"/>
  <rect x="110" y="18" width="15" height="8" fill="#D32F2F"/>

  <!-- ОЧКИ АВИАТОРЫ (Огромные) -->
  <rect x="30" y="25" width="60" height="16" fill="#1A1A1A"/>
  <!-- Блики на очках -->
  <rect x="40" y="28" width="12" height="8" fill="#FFFFFF"/>
  <rect x="70" y="28" width="12" height="8" fill="#FFFFFF"/>

  <!-- СУРОВЫЙ РОТ И СИГАРА -->
  <rect x="45" y="48" width="20" height="4" fill="#1A1A1A"/> <!-- Рот -->
  <rect x="15" y="46" width="15" height="5" fill="#5D4037"/> <!-- Сигара -->
  <rect x="10" y="46" width="5" height="5" fill="#FF5722"/> <!-- Огонёк -->

  <!-- УСИКИ (Торчат вверх) -->
  <rect x="45" y="0" width="4" height="10" fill="#1A1A1A"/>
  <rect x="40" y="-4" width="14" height="4" fill="#1A1A1A"/>
  <rect x="70" y="0" width="4" height="10" fill="#1A1A1A"/>
  <rect x="65" y="-4" width="14" height="4" fill="#1A1A1A"/>
</svg>
