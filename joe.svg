<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- ФОН (прозрачный) -->

  <!-- КРЫЛЬЯ (Сзади, как на рисунке) -->
  <path d="M 150 100 L 220 80 L 210 110 L 230 120 L 180 150 Z" fill="#AED6F1" opacity="0.6" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>

  <!-- ЗАДНЯЯ НОГА -->
  <path d="M 140 190 L 135 230 L 155 230 L 150 190 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="6"/>
  <!-- Задний ботинок -->
  <path d="M 135 230 L 120 240 L 120 250 L 160 250 L 160 230 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="6"/>

  <!-- ТЕЛО (Жёлтое, грушевидное) -->
  <ellipse cx="115" cy="150" rx="45" ry="55" fill="#F1C40F" stroke="#1A1A1A" stroke-width="8"/>

  <!-- РЕМЕНЬ (Толстый, диагональный, как на скетче) -->
  <path d="M 70 180 L 160 90 L 150 80 L 60 170 Z" fill="#3E2723" stroke="#1A1A1A" stroke-width="6"/>
  <!-- Пряжка ремня -->
  <circle cx="110" cy="135" r="8" fill="#616161" stroke="#1A1A1A" stroke-width="4"/>
  <circle cx="110" cy="135" r="3" fill="#1A1A1A"/>

  <!-- ПЕРЕДНЯЯ НОГА -->
  <path d="M 100 190 L 80 230 L 100 230 L 110 190 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="6"/>
  <!-- Передний ботинок -->
  <path d="M 80 230 L 60 240 L 60 250 L 110 250 L 110 230 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="6"/>

  <!-- РУКИ (Толстые, мускулистые) -->
  <!-- Левая рука (за пушкой) -->
  <path d="M 80 120 Q 60 150 70 180 L 90 170 Q 80 140 100 120 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  <!-- Правая рука (держит пушку) -->
  <path d="M 150 120 Q 170 150 160 170 L 140 160 Q 150 140 130 120 Z" fill="#F1C40F" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>

  <!-- ОГРОМНАЯ ПУШКА (Диагональная, как на рисунке) -->
  <!-- Ствол -->
  <path d="M 60 200 L 180 70 L 200 90 L 80 220 Z" fill="#424242" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  <!-- Дуло (расширение) -->
  <path d="M 180 70 L 210 40 L 230 60 L 200 90 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  <!-- Рукоять / приклад -->
  <path d="M 60 200 L 40 220 L 50 230 L 70 210 Z" fill="#5D4037" stroke="#1A1A1A" stroke-width="6"/>
  <!-- Магазин / деталь -->
  <rect x="110" y="140" width="15" height="30" rx="5" fill="#1A1A1A" transform="rotate(-45 110 140)"/>

  <!-- ГОЛОВА (Крупная, наклонённая) -->
  <ellipse cx="130" cy="70" rx="45" ry="50" fill="#F1C40F" stroke="#1A1A1A" stroke-width="8"/>

  <!-- УСИКИ (Загнутые, как на рисунке) -->
  <path d="M 110 25 Q 100 -10 80 10" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="10" r="6" fill="#1A1A1A"/>
  <path d="M 150 25 Q 160 -10 180 10" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="180" cy="10" r="6" fill="#1A1A1A"/>

  <!-- ЗЛЫЕ ГЛАЗА (Как на твоём рисунке) -->
  <!-- Брови (V-образные) -->
  <path d="M 100 50 L 120 60" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 160 50 L 140 60" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- Зрачки -->
  <ellipse cx="115" cy="65" rx="5" ry="8" fill="#1A1A1A"/>
  <ellipse cx="145" cy="65" rx="5" ry="8" fill="#1A1A1A"/>

  <!-- СУРОВЫЙ РОТ -->
  <path d="M 115 85 Q 130 90 145 85" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
</svg>
