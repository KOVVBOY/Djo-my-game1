<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- ФОН (прозрачный) -->

  <!-- КРЫЛЬЯ (Сзади, как на скетче) -->
  <rect x="85" y="30" width="35" height="55" fill="#AED6F1" opacity="0.6"/>
  <rect x="95" y="35" width="25" height="45" fill="#AED6F1" opacity="0.9"/>
  <rect x="105" y="40" width="15" height="25" fill="#FFFFFF" opacity="0.8"/>

  <!-- ЗАДНЯЯ НОГА -->
  <rect x="75" y="95" width="10" height="22" fill="#F1C40F"/>
  <rect x="65" y="115" width="25" height="10" fill="#3E2723"/> <!-- Ботинок -->
  <rect x="65" y="123" width="25" height="3" fill="#1A1A1A"/> <!-- Подошва -->

  <!-- БРЮШКО ШМЕЛЯ (Сзади, округлое, БЕЗ ЖАЛА) -->
  <rect x="70" y="65" width="40" height="40" rx="15" fill="#FFCA28"/>
  <!-- Чёрные полоски -->
  <rect x="80" y="65" width="8" height="40" fill="#212121"/>
  <rect x="95" y="65" width="8" height="40" fill="#212121"/>
  <!-- Тень под брюшком -->
  <rect x="70" y="95" width="40" height="10" rx="5" fill="#F9A825"/>

  <!-- ТОРС (Кожаная куртка) -->
  <rect x="40" y="55" width="45" height="50" fill="#1A1A1A"/>
  <!-- Воротник -->
  <rect x="40" y="55" width="45" height="8" fill="#424242"/>
  
  <!-- ДИАГОНАЛЬНЫЙ РЕМЕНЬ (Как на твоём рисунке) -->
  <path d="M 45 60 L 80 95 L 75 100 L 40 65 Z" fill="#3E2723"/>
  <rect x="55" y="75" width="6" height="6" fill="#616161"/> <!-- Пряжка -->
  <rect x="70" y="90" width="6" height="6" fill="#616161"/> <!-- Пряжка -->

  <!-- ПЕРЕДНЯЯ НОГА -->
  <rect x="50" y="95" width="10" height="22" fill="#F1C40F"/>
  <rect x="40" y="115" width="25" height="10" fill="#3E2723"/> <!-- Ботинок -->
  <rect x="40" y="123" width="25" height="3" fill="#1A1A1A"/> <!-- Подошва -->

  <!-- РУКА (Держит пушку) -->
  <rect x="25" y="75" width="15" height="20" fill="#1A1A1A"/>
  <rect x="20" y="90" width="15" height="12" fill="#F1C40F"/> <!-- Кулак -->

  <!-- ПУШКА (Вытянута вперёд) -->
  <rect x="10" y="70" width="25" height="15" fill="#616161"/> <!-- Ствол -->
  <rect x="0" y="73" width="15" height="9" fill="#1A1A1A"/> <!-- Дуло -->
  <rect x="15" y="85" width="15" height="18" fill="#424242"/> <!-- Магазин -->
  <rect x="20" y="90" width="8" height="8" fill="#1A1A1A"/> <!-- Рукоять -->

  <!-- ГОЛОВА (Огромная, как в скетче) -->
  <rect x="35" y="10" width="55" height="50" rx="20" fill="#F1C40F"/>
  
  <!-- ТЕНЬ ПОД ПОДБОРОДКОМ -->
  <rect x="35" y="50" width="55" height="10" fill="#F9A825"/>

  <!-- БАНДАНА (Красная, сзади) -->
  <rect x="25" y="0" width="70" height="12" fill="#D32F2F"/>
  <rect x="85" y="8" width="20" height="8" fill="#D32F2F"/>
  <rect x="95" y="16" width="15" height="8" fill="#D32F2F"/>

  <!-- ОГРОМНЫЕ ГЛАЗА (Как на рисунке) -->
  <rect x="40" y="20" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="65" y="20" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
  <!-- Зрачки -->
  <rect x="46" y="25" width="8" height="8" rx="4" fill="#1A1A1A"/>
  <rect x="71" y="25" width="8" height="8" rx="4" fill="#1A1A1A"/>

  <!-- НОС / МОРДА (Выступает вперёд) -->
  <rect x="30" y="35" width="10" height="15" fill="#F1C40F" stroke="#1A1A1A" stroke-width="4"/>

  <!-- РОТ (Суровая линия) -->
  <rect x="45" y="46" width="20" height="4" fill="#1A1A1A"/>

  <!-- ПРЕДМЕТ У РТА (Сигара или детонатор) -->
  <rect x="20" y="45" width="15" height="5" fill="#5D4037"/>
  <rect x="15" y="45" width="5" height="5" fill="#FF5722"/> <!-- Огонёк -->

  <!-- УСИКИ (Загнутые) -->
  <rect x="40" y="-2" width="4" height="15" fill="#1A1A1A"/>
  <rect x="35" y="-5" width="12" height="4" fill="#1A1A1A"/>
  <rect x="70" y="-2" width="4" height="15" fill="#1A1A1A"/>
  <rect x="65" y="-5" width="12" height="4" fill="#1A1A1A"/>
</svg>
